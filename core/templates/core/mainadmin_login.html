{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin sign in · MNBJYN</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'core/css/site.css' %}">
<style>
:root{--brand-red:#14B8A6;--ink:#142B4A;--muted:#686868;--line:#E1E8F0;--paper:#fff;--wash:#F6F8FB}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(100%,430px);background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:36px;box-shadow:0 18px 55px #142B4A0b}.brand{display:flex;align-items:center;gap:11px;margin-bottom:34px;font-weight:600;letter-spacing:.02em}.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--brand-red);color:#fff;display:grid;place-items:center;font-size:14px;letter-spacing:.04em}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--brand-red);font-weight:650;margin:0 0 8px}.login-card h1{font-size:27px;line-height:1.2;font-weight:550;letter-spacing:-.035em;margin:0 0 9px}.intro{color:var(--muted);margin:0 0 27px;font-size:14px}.field{display:block;font-size:13px;font-weight:550;margin:17px 0 7px}.field-input{width:100%;border:1px solid #D6E0EA;border-radius:9px;padding:12px 13px;font:inherit;background:#fff;outline:none}.field-input:focus{border-color:var(--brand-red);box-shadow:0 0 0 3px #14B8A618}.submit{width:100%;border:0;border-radius:9px;padding:13px;background:var(--brand-red);color:#fff;font:inherit;font-weight:600;margin-top:23px;cursor:pointer}.submit:hover{background:#0F766E}.error{background:#F0FDFA;color:#142B4A;border:1px solid #99F6E4;border-radius:8px;padding:11px 12px;font-size:13px;margin:0 0 14px}.foot{color:var(--muted);font-size:12px;text-align:center;margin:24px 0 0}.back{display:block;text-align:center;color:var(--muted);font-size:13px;margin-top:18px;text-decoration:none}.back:hover{color:var(--brand-red)}
</style></head><body><main class="login-card"><div class="brand"><span class="brand-mark">SB</span><span>MNBJYN <span style="color:#aaa;font-weight:400">/ Administration</span></span></div><p class="eyebrow">Restricted workspace</p><h1>Admin sign in</h1><p class="intro">Sign in with your authorized staff account to manage registered members.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" autocomplete="on">{% csrf_token %}<label class="field" for="username">Username</label><input class="field-input" id="username" name="username" autocomplete="username" required autofocus><label class="field" for="password">Password</label><input class="field-input" id="password" name="password" type="password" autocomplete="current-password" required><button class="submit" type="submit">Sign in securely</button></form>
<p class="foot">Authorized MNBJYN administrators only.</p><a class="back" href="/">← Return to website</a></main></body></html>
