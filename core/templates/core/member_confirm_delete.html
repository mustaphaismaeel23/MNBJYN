{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delete member · {{ ORG_SHORT }}</title><link rel="stylesheet" href="{% static 'core/css/site.css' %}"><style>body{background:#F6F8FB;color:#142B4A;font:14px/1.6 "DM Sans",system-ui,sans-serif}.confirm{width:min(560px,calc(100% - 28px));margin:12vh auto;background:white;border:1px solid #E1E8F0;border-radius:9px;padding:28px}.confirm h1{font:500 28px/1.2 "DM Sans",sans-serif;text-transform:none;letter-spacing:-.03em}.confirm p{color:#666;margin:15px 0 24px}.actions{display:flex;gap:9px}.btn{padding:10px 15px;border-radius:5px;background:#14B8A6;color:#142B4A;border:1px solid #14B8A6;font:500 13px "DM Sans",sans-serif;cursor:pointer;text-decoration:none}.cancel{background:white;color:#142B4A;border-color:#D6E0EA}</style></head><body><main class="confirm"><p style="color:#14B8A6;font-size:11px;text-transform:uppercase;letter-spacing:.08em">Confirm deletion</p><h1>Delete {{ member.full_name }}?</h1><p>This permanently removes this member registration ({{ member.reference }}). This action cannot be undone.</p><form method="post" class="actions">{% csrf_token %}<button class="btn" type="submit">Delete member</button><a class="btn cancel" href="{% url 'core:mainadmin' %}">Cancel</a></form></main></body></html>
